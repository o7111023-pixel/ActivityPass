services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activitypass}
      POSTGRES_USER: ${POSTGRES_USER:-activitypass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-activitypass} -d ${POSTGRES_DB:-activitypass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-activitypass}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-activitypass}
      ACTIVITYPASS_SECRET_KEY: ${ACTIVITYPASS_SECRET_KEY:?Set ACTIVITYPASS_SECRET_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
