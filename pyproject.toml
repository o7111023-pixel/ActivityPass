[project]
name = "activitypass"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "qrcode[pil]>=7.4",
  "python-barcode>=0.15",
  "Pillow>=10.0",
  "psycopg[binary]>=3.2"
]

[tool.vercel]
entrypoint = "app/main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
